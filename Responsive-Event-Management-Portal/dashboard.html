<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid p-4">
        <h2 class="mb-4">Student Dashboard</h2>
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Total Students</h5>
                        <p class="card-text display-6">250</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Present Students</h5>
                        <p class="card-text display-6">225</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Absent Students</h5>
                        <p class="card-text display-6">25</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Placements</h5>
                        <p class="card-text display-6">180</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="mb-3">
            <input type="text" class="form-control" placeholder="Search...">
        </div>

        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Roll No</th>
                        <th>Name</th>
                        <th>Branch</th>
                        <th>Attendance</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>001</td>
                        <td>Aarav Kumar</td>
                        <td>CSE</td>
                        <td><span class="badge bg-success">92%</span></td>
                    </tr>
                    <tr>
                        <td>002</td>
                        <td>Bhavna Singh</td>
                        <td>ECE</td>
                        <td><span class="badge bg-success">88%</span></td>
                    </tr>
                    <tr>
                        <td>003</td>
                        <td>Chirag Patel</td>
                        <td>MECH</td>
                        <td><span class="badge bg-danger">75%</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
