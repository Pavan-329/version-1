<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Students</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <header>
            <nav>
                <a href="./addstudent.html">Add Student</a>
                <a href="./viewstudents.html">View Students</a>
                <a href="./index.html">Logout</a>
            </nav>
        </header>
        <main>
            <h1>View Students</h1>
            <table id="table">
                <tr>
                    <th>Roll Number</th>
                    <th>Name</th>
                    <th>Branch</th>
                    <th>CGPA</th>
                    <th>Edit</th>
                    <th>Delete</th>
                </tr>
        </main>
    </div>
    <script>
        const students = JSON.parse(localStorage.getItem("students")) || [];
        const table = document.getElementById("table");
        for (let i = 0; i < students.length; i++) {
            const row = table.insertRow();
            row.insertCell(0).innerText = students[i].rollno;
            row.insertCell(1).innerText = students[i].name;
            row.insertCell(2).innerText = students[i].branch;
            row.insertCell(3).innerText = students[i].cgpa;
            const editCell = row.insertCell(4);
            const editButton = document.createElement("button");
            editButton.innerText = "Edit";
            editButton.addEventListener("click", function () {
                localStorage.setItem("editIndex", i);
                window.location.href = "./editstudent.html";
            });
            editCell.appendChild(editButton);
            const deleteCell = row.insertCell(5);
            const deleteButton = document.createElement("button");
            deleteButton.innerText = "Delete";
            deleteButton.addEventListener("click", function () {
                students.splice(i, 1);
                localStorage.setItem("students", JSON.stringify(students));
                window.location.reload();
            });
            deleteCell.appendChild(deleteButton);
        }
    </script>
</body>

</html>
