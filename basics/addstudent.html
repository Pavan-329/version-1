<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <header>
            <nav>
                <a href="./addstudent.html">Add Student</a>
                <a href="./viewstudents.html">View Students</a>
                <a href="./index.html">Logout</a>
            </nav>
        </header>
        <main>
            <h1>Add a Student</h1>
            <form id="form">
                <label for="rollNumber">Enter the Roll Number :</label>
                <input type="text" id="rollno" required>
                <label for="name">Enter the Name :</label>
                <input type="text" id="name" required>
                <label for="branch">Enter the Branch:</label>
                <input type="text" id="branch" required>
                <label for="cgpa">Enter the CGPA:</label>
                <input type="number" id="cgpa" required>
                <button type="submit">Add Student</button>
            </form>
        </main>
    </div>
    <script>
        const form = document.querySelector("form");

        form.addEventListener("submit", function (e) {
            e.preventDefault();

            const rollno = document.getElementById("rollno").value;
            const name = document.getElementById("name").value;
            const branch = document.getElementById("branch").value;
            const cgpa = document.getElementById("cgpa").value;

            const student = {
                rollno,
                name,
                branch,
                cgpa
            };

            let students = JSON.parse(localStorage.getItem("students")) || [];
            students.push(student);
            localStorage.setItem("students", JSON.stringify(students));
            alert("Student Added Successfully!");
            form.reset();
            window.location.href = "./viewstudents.html";
        });
        </script>
</body>
</html>
