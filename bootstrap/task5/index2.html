<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reorder Columns Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container py-4">
        <h3 class="mb-4">Reordering Columns at md Breakpoint</h3>
        <div class="row">
            <!-- On mobile: Sidebar appears first. On md and up: Sidebar moves second -->
            <div class="col-12 col-md-4 order-md-2">
                <div class="p-4 border rounded bg-light">Sidebar (order-md-2)</div>
            </div>

            <!-- On mobile: Content appears second. On md and up: Content moves first -->
            <div class="col-12 col-md-8 order-md-1">
                <div class="p-4 border rounded bg-white">Main Content (order-md-1)</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoWJ2RvG9JO7QdtQHhUPtFTg+jgXTx5A9/tpX3TBTkF7CXvN" crossorigin="anonymous"></script>
</body>
</html>
